plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.voidream.chatgptselectionfix'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.voidream.chatgptselectionfix'
        minSdk 32
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Compile-time only. The Xposed bridge is provided by LSPosed at runtime.
    compileOnly 'de.robv.android.xposed:api:82'
}
