plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.voidream.chatgptselectionfix'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'dev.voidream.chatgptselectionfix'
        minSdk 32
        targetSdk 35
        versionCode 3
        versionName '0.2.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Compile-time only. LSPosed provides the Xposed bridge at runtime.
    compileOnly 'de.robv.android.xposed:api:82'
}
